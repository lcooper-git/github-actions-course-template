name: Check Repo Variable

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      is_populated:
        description: 'true if the TEST variable is set and non-empty, otherwise false'
        value: ${{ jobs.check.outputs.is_populated }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      is_populated: ${{ steps.check.outputs.is_populated }}
    steps:
      - name: Check TEST variable
        id: check
        env:
          TEST_VALUE: ${{ vars.TEST }}
        run: |
          if [ -n "${TEST_VALUE// /}" ]; then
            is_populated=true
          else
            is_populated=false
          fi
          echo "is_populated=$is_populated" >> "$GITHUB_OUTPUT"
          echo "TEST populated: $is_populated" >> "$GITHUB_STEP_SUMMARY"
          echo "${TEST_VALUE}" | sed -e 's/\(.\)/\1\n/g'

      - name: Result
        run: |
          echo "${{ steps.check.outputs.is_populated }}"
